# CT19 no osciloscopio: trem de pulsos de 10 ms (periodo de 50 ms) no GPIO1 (PC8), para enquadrar o pulso
# com o gatilho em modo normal. Rodar em loop: python executar_bateria.py baterias/ct19_pulso_10ms_continuo.yaml --repetir 300
bateria: ct19-pulso-10ms-continuo
dut: nenhum (osciloscopio no PC8)
