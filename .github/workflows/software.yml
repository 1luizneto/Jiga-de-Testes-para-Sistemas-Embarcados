name: Testes do software

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Software/**"
      - "DUT_ESP32S3/**"
      - "projeto/App/Test/Unity/**"
      - "projeto/App/Exec/**"
      - "projeto/App/System/**"
      - "projeto/App/Comm/Inc/**"
      - "projeto/App/Test/Suites/Test_Exec.c"
      - "projeto/App/Test/host/**"
      - "CHANGELOG.md"
      - ".github/workflows/software.yml"
  pull_request:
    paths:
      - "Software/**"
      - "DUT_ESP32S3/**"
      - "projeto/App/Test/Unity/**"
      - "projeto/App/Exec/**"
      - "projeto/App/System/**"
      - "projeto/App/Comm/Inc/**"
      - "projeto/App/Test/Suites/Test_Exec.c"
      - "projeto/App/Test/host/**"
      - "CHANGELOG.md"
      - ".github/workflows/software.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PySide6 fica de fora: os testes nao abrem a interface grafica
      - run: pip install "pyserial>=3.5" "pytest>=8"
      - run: pytest -v

  # Interpretador de comandos e mapa I2C do DUT de referencia (ESP32-S3), compilados no PC com o Unity da jiga
  dut-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh DUT_ESP32S3/test_host/rodar.sh

  # Exec e Rotina (Test_Exec.c) compilados no PC com o Unity e os perifericos falsos da suite
  firmware-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh projeto/App/Test/host/rodar.sh
